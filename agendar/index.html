  <script>
    // Instalado na tela inicial ou aberto pelo ícone (?app=1): só o aplicativo.
    // Fica lembrado nesta janela, para um recarregar não virar site.
    (function () {
      var app = navigator.standalone === true || /[?&]app=1/.test(location.search) ||
        ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) {
          return matchMedia('(display-mode: ' + m + ')').matches; });
      try {
        app = app || sessionStorage.getItem('modo-app') === '1';
        if (app) sessionStorage.setItem('modo-app', '1');
      } catch (_) {}
      if (app) document.documentElement.classList.add('modo-app');
    })();
  </script>
